# Single source of truth for every hyperparameter and path.
# Scripts must never hardcode a value that lives here.

model:
  base_id: unsloth/Qwen3-8B
  max_seq_length: 2048
  load_in_4bit: true

data:
  hf_dataset: nvidia/Nemotron-Personas-Brazil
  n_train: 20000
  n_val: 500
  n_test: 200
  seed: 3407
  max_name_drop_rate: 0.05

lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0.0
  bias: none
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  use_gradient_checkpointing: unsloth
  random_state: 3407

train:
  per_device_train_batch_size: 2
  # Eval materialises full logits (vocab 151936); at the default batch of 8 that is
  # several GB on top of a training peak that already sits at ~8GB of 9.5GB free.
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  # Sort similar-length sequences into the same batch. Targets range 775-1458 tokens,
  # so without this a short sequence is padded up to the longest in its batch.
  group_by_length: true
  num_train_epochs: 1
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  optim: adamw_8bit
  weight_decay: 0.01
  logging_steps: 10
  eval_steps: 100
  save_steps: 250
  save_total_limit: 3
  seed: 3407

decode:
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repeat_penalty: 1.05
  n_predict: 1024
  seed: 3407

llamacpp:
  # Recorded after the first `make setup`; export LLAMA_COMMIT to pin the build.
  commit: ""

paths:
  data_dir: data
  outputs_dir: outputs
  llamacpp_dir: vendor/llama.cpp
